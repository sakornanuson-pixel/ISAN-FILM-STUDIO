<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ISAN FILM STUDIO</title>
<style>
:root{font-family:system-ui,"Noto Sans Thai",sans-serif;color:#f1f5f9;background:#0b1120}*{box-sizing:border-box}body{margin:0}header{background:#111c30;border-bottom:1px solid #27364e;padding:18px 20px;position:sticky;top:0;z-index:2}h1{font-size:20px;margin:0}small,.muted{color:#9baec6}main{max-width:1050px;margin:auto;padding:18px}nav{display:flex;gap:8px;overflow:auto;padding:12px 0}button,input,textarea,select{font:inherit}button{background:#243754;color:#fff;border:1px solid #405574;border-radius:10px;padding:10px 14px;cursor:pointer}button.primary{background:#2563eb;border-color:#3b82f6}button.danger{background:#5c2731;border-color:#8d4350}button:disabled{opacity:.5;cursor:not-allowed}button.active{background:#2563eb}input,textarea,select{width:100%;background:#101b2d;border:1px solid #405574;border-radius:9px;color:#fff;padding:11px;margin:5px 0 13px}textarea{min-height:100px;resize:vertical}label{display:block;font-size:13px;color:#c5d4e6}section,.panel{background:#152239;border:1px solid #2b3c57;border-radius:14px;padding:17px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.item{border:1px solid #354967;border-radius:11px;padding:12px;margin:10px 0;background:#101b2d}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.row>*{flex-shrink:0}h2{margin:0 0 12px;font-size:19px}h3{margin:5px 0 10px;font-size:16px}.tag{border-radius:30px;background:#294063;padding:4px 9px;font-size:12px}pre{white-space:pre-wrap;word-break:break-word;background:#0b1423;padding:13px;border-radius:10px;font-size:12px;max-height:400px;overflow:auto}.warn{color:#fbbf24}.ok{color:#86efac}img.thumb{max-width:100%;max-height:180px;border-radius:8px}footer{padding:20px;text-align:center;color:#91a4be}@media(min-width:750px){main{padding:28px}header{padding-left:max(20px,calc((100vw - 1050px)/2))}}
.welcome{background:linear-gradient(135deg,#172f52,#152239)}.project-card{padding:18px}.project-icon{font-size:28px;background:#223b5e;border-radius:12px;padding:12px}.wide{width:100%;margin-top:8px}.quick{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:7px;min-height:120px;background:#182b46}.quick strong{font-size:16px}.quick small{font-size:12px}.quick:hover,.project-card:hover{border-color:#5b85c6}nav button{white-space:nowrap;flex:0 0 auto;min-width:max-content}nav{scrollbar-width:thin} .tag{display:inline-block;white-space:nowrap} .item h3{line-height:1.65} @media(max-width:520px){main{padding:12px}section,.panel{padding:14px}header{padding:14px}nav{gap:7px}nav button{padding:11px 13px}.item .row>*{flex-shrink:1}}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}</style></head><body><header><h1>🎬 ISAN FILM STUDIO</h1><small>ระบบจัดการผลิตคลิปบักดำ–อีหล้า • FLOW Prompt Studio</small></header><main><nav id="tabs"></nav><div id="view"></div></main><footer>ข้อมูลจัดเก็บในเบราว์เซอร์เครื่องนี้ • สำรองไฟล์ JSON เป็นประจำ</footer>
<script>
"use strict";
const KEY="isan-film-studio-v1";
const blank=()=>({projects:[{id:"p1",name:"บักดำ–อีหล้า",description:"ซีรีส์ตลกอีสาน",created:Date.now()}],characters:[],scenes:[],dialogues:[]});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||blank();if(!Array.isArray(db.projects)||!Array.isArray(db.scenes)||!Array.isArray(db.dialogues)||!Array.isArray(db.characters))throw Error("Invalid");}catch{db=blank()}
let tab="dashboard",project=db.projects[0]?.id||"",selectedScene=null;
const $=s=>document.querySelector(s),uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){alert("บันทึกไม่สำเร็จ: พื้นที่จัดเก็บเต็ม กรุณาสำรองข้อมูล");}};
const byProject=(arr)=>arr.filter(x=>x.projectId===project);
const sceneList=()=>byProject(db.scenes).sort((a,b)=>a.order-b.order);
const dlgList=id=>db.dialogues.filter(x=>x.sceneId===id).sort((a,b)=>a.order-b.order);
const pSelect=()=>'<label>โปรเจกต์<select id="projectPick">'+db.projects.map(p=>'<option value="'+esc(p.id)+'" '+(p.id===project?'selected':'')+'>'+esc(p.name)+'</option>').join("")+'</select></label>';
const field=(name,label,value="",type="text")=>'<label>'+label+'<input name="'+name+'" type="'+type+'" value="'+esc(value)+'" required></label>';
const area=(name,label,value="")=>'<label>'+label+'<textarea name="'+name+'">'+esc(value)+'</textarea></label>';
function render(){const labels=[["dashboard","ภาพรวม"],["projects","โปรเจกต์"],["characters","ตัวละคร"],["scenes","ฉาก"],["script","บทพูด"],["prompt","Prompt Studio"],["backup","สำรองข้อมูล"]];$("#tabs").innerHTML=labels.map(([id,n])=>'<button class="'+(tab===id?"active":"")+'" data-tab="'+id+'">'+n+'</button>').join("");$("#view").innerHTML=pages[tab]();document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});const picker=$("#projectPick");if(picker)picker.onchange=()=>{project=picker.value;selectedScene=null;render()};wire();}
const formData=f=>Object.fromEntries(new FormData(f));
const pages={
dashboard:()=>'<section class="welcome"><span class="tag">เริ่มต้นง่าย ๆ</span><h2>สวัสดีครับ พร้อมสร้างคลิปกันหรือยัง?</h2><p class="muted">เลือกโปรเจกต์ที่ต้องการทำงานต่อ ไม่ต้องตั้งค่าอะไรให้ยุ่งยาก</p></section><section><h2>โปรเจกต์ของฉัน</h2>'+db.projects.map(p=>'<div class="item project-card"><div class="row"><span class="project-icon">🎬</span><div><h3>'+esc(p.name)+'</h3><small>'+esc(p.description||"โปรเจกต์ผลิตคลิป")+'</small></div></div><p class="muted">'+db.scenes.filter(s=>s.projectId===p.id).length+' ฉาก · '+db.dialogues.filter(d=>d.projectId===p.id).length+' บทพูด</p><button class="primary wide" data-open-project="'+esc(p.id)+'">เปิดงาน →</button></div>').join("")+'<button class="wide" data-tab="projects">＋ สร้างโปรเจกต์ใหม่</button></section><section><h2>ทำงานต่อได้ทันที</h2><div class="grid"><button class="quick" data-go="scenes">🎞️<strong>จัดการฉาก</strong><small>เพิ่มฉากและแก้ไขรายละเอียด</small></button><button class="quick" data-go="script">💬<strong>บทพูด</strong><small>ตรวจและล็อกบทที่อนุมัติ</small></button><button class="quick" data-go="characters">👥<strong>ตัวละคร</strong><small>ข้อมูลและภาพมาสเตอร์</small></button><button class="quick" data-go="prompt">📋<strong>Prompt สำหรับ FLOW</strong><small>สร้างและคัดลอกคำสั่ง</small></button></div></section>',
projects:()=>'<section><h2>โปรเจกต์</h2><form id="newProject">'+field("name","ชื่อโปรเจกต์")+area("description","รายละเอียด")+'<button class="primary">เพิ่มโปรเจกต์</button></form></section><section>'+db.projects.map(p=>'<div class="item"><b>'+esc(p.name)+'</b><p>'+esc(p.description)+'</p></div>').join("")+'</section>',
characters:()=>'<section><h2>ตัวละคร</h2>'+pSelect()+'<form id="newCharacter">'+field("name","ชื่อตัวละคร")+area("identity","เอกลักษณ์ / สัดส่วน / เครื่องแต่งกาย")+field("image","ลิงก์ภาพมาสเตอร์ (URL ไม่บังคับ)")+'<button class="primary">เพิ่มตัวละคร</button></form></section><section>'+byProject(db.characters).map(c=>'<div class="item"><h3>'+esc(c.name)+'</h3><p>'+esc(c.identity)+'</p>'+(c.image&&/^https:\/\//.test(c.image)?'<a href="'+esc(c.image)+'" target="_blank" rel="noopener noreferrer">เปิดภาพมาสเตอร์</a>':'')+'</div>').join("")+'</section>',
scenes:()=>'<section><h2>จัดการฉาก</h2>'+pSelect()+'<form id="newScene">'+field("title","ชื่อฉาก")+ '<label>ความยาว<select name="duration"><option>4</option><option>6</option><option selected>8</option><option>10</option></select></label>'+area("location","สถานที่และเวลา")+area("camera","มุมกล้อง / ระยะภาพ")+area("emotion","อารมณ์เริ่มต้นและความต่อเนื่อง")+area("action","START → ACTION → END")+'<button class="primary">เพิ่มฉาก</button></form></section><section><h2>รายการฉาก</h2>'+sceneList().map(s=>'<div class="item"><h3>'+esc(s.order)+'. '+esc(s.title)+' <span class="tag">'+s.duration+' วินาที</span></h3><p>'+esc(s.location)+'</p><button data-edit-scene="'+esc(s.id)+'">แก้ไขฉาก</button> <button data-select-scene="'+esc(s.id)+'">เลือกสำหรับบทพูด</button></div>').join("")+'</section><section id="sceneEditor" hidden></section>',
script:()=>'<section><h2>บทพูดและ Script Lock</h2>'+pSelect()+scenePicker()+'<form id="newDialogue">'+field("speaker","ผู้พูด")+area("text","บทพูดตามต้นฉบับ")+field("start","เริ่มพูด (วินาที)","1","number")+field("end","จบพูด (วินาที)","5","number")+'<button class="primary" '+(!selectedScene?'disabled':'')+'>เพิ่มบทพูด</button></form></section><section>'+(!selectedScene?'<p>กรุณาเลือกฉากก่อน</p>':dlgList(selectedScene).map(d=>'<div class="item"><div class="row"><b>'+esc(d.speaker)+'</b><span class="tag">'+d.start+'–'+d.end+'s</span><span class="tag">'+(d.locked?'🔒 LOCKED':'แก้ไขได้')+'</span></div><p>'+esc(d.text)+'</p><button data-lock="'+esc(d.id)+'">'+(d.locked?'ปลดล็อก (ต้องยืนยัน)':'ล็อกบทพูด')+'</button> '+(!d.locked?'<button data-edit-dialogue="'+esc(d.id)+'">แก้ไข</button> <button class="danger" data-delete-dialogue="'+esc(d.id)+'">ลบ</button>':'')+'</div>').join(""))+'</section>',
prompt:()=>'<section><h2>FLOW Prompt Studio</h2>'+pSelect()+scenePicker()+'<button class="primary" id="generate" '+(!selectedScene?'disabled':'')+'>สร้างและตรวจ Prompt</button></section><section id="output"><p class="muted">เลือกฉากแล้วกดสร้าง Prompt</p></section>',
backup:()=>'<section><h2>สำรองและกู้คืนข้อมูล</h2><p>ไฟล์สำรองรวมโปรเจกต์ ตัวละคร ฉาก และบทพูด (ไม่รวมไฟล์ภาพที่ฝากไว้ภายนอก)</p><button id="export">ดาวน์โหลด JSON</button><label>นำเข้าไฟล์สำรอง JSON<input type="file" id="import" accept=".json,application/json"></label><p class="warn">การนำเข้าจะเขียนทับข้อมูลปัจจุบัน กรุณาสำรองก่อน</p></section>'
};
function scenePicker(){const scenes=sceneList();if(!scenes.some(s=>s.id===selectedScene))selectedScene=scenes[0]?.id||null;return '<label>ฉาก<select id="scenePick">'+scenes.map(s=>'<option value="'+esc(s.id)+'" '+(s.id===selectedScene?'selected':'')+'>'+esc(s.order)+'. '+esc(s.title)+'</option>').join("")+'</select></label>'}
function wire(){document.querySelectorAll("[data-open-project]").forEach(b=>b.onclick=()=>{project=b.dataset.openProject;selectedScene=null;tab="scenes";render()});document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{tab=b.dataset.go;render()});const on=(id,event,fn)=>{const el=$("#"+id);if(el)el.addEventListener(event,fn)};on("newProject","submit",e=>{e.preventDefault();let v=formData(e.target);let id=uid();db.projects.push({id,...v,created:Date.now()});project=id;save();render()});on("newCharacter","submit",e=>{e.preventDefault();db.characters.push({id:uid(),projectId:project,...formData(e.target)});save();render()});on("newScene","submit",e=>{e.preventDefault();let v=formData(e.target);db.scenes.push({id:uid(),projectId:project,order:sceneList().length+1,...v,duration:Number(v.duration)});save();render()});on("scenePick","change",e=>{selectedScene=e.target.value;render()});on("newDialogue","submit",e=>{e.preventDefault();let v=formData(e.target),s=db.scenes.find(s=>s.id===selectedScene);if(!s)return;v.start=Number(v.start);v.end=Number(v.end);if(!v.speaker.trim()||!v.text.trim()||!Number.isFinite(v.start)||!Number.isFinite(v.end)||v.start<0||v.end<=v.start||v.end>s.duration){alert("ตรวจเวลาและข้อความบทพูด");return}db.dialogues.push({id:uid(),projectId:project,sceneId:selectedScene,order:dlgList(selectedScene).length+1,...v,locked:false});save();render()});
document.querySelectorAll("[data-select-scene]").forEach(b=>b.onclick=()=>{selectedScene=b.dataset.selectScene;tab="script";render()});
document.querySelectorAll("[data-edit-scene]").forEach(b=>b.onclick=()=>{let s=db.scenes.find(x=>x.id===b.dataset.editScene),el=$("#sceneEditor");el.hidden=false;el.innerHTML='<h2>แก้ไข: '+esc(s.title)+'</h2><form id="editScene">'+field("title","ชื่อฉาก",s.title)+field("duration","เวลา (4/6/8/10)",s.duration,"number")+area("location","สถานที่",s.location)+area("camera","กล้อง",s.camera)+area("emotion","อารมณ์",s.emotion)+area("action","START / ACTION / END",s.action)+'<button class="primary">บันทึก</button></form>';$("#editScene").onsubmit=e=>{e.preventDefault();let v=formData(e.target),dur=Number(v.duration);if(![4,6,8,10].includes(dur)||dlgList(s.id).some(d=>d.end>dur)){alert("ระยะเวลาฉากไม่ถูกต้องหรือสั้นกว่าบทพูด");return}Object.assign(s,v,{duration:dur});save();render()};el.scrollIntoView({behavior:"smooth"})});
document.querySelectorAll("[data-lock]").forEach(b=>b.onclick=()=>{let d=db.dialogues.find(x=>x.id===b.dataset.lock);if(d.locked&&!confirm("ปลดล็อกบทพูดที่อนุมัติแล้วหรือไม่?"))return;d.locked=!d.locked;save();render()});
document.querySelectorAll("[data-edit-dialogue]").forEach(b=>b.onclick=()=>{let d=db.dialogues.find(x=>x.id===b.dataset.editDialogue);if(d.locked)return;let box=document.createElement("div");box.className="item";box.innerHTML="<h3>แก้ไขบทพูด</h3><label>ข้อความบทพูด<textarea id=\"dialogueEditText\"></textarea></label><div class=\"row\"><button class=\"primary\" id=\"saveDialogueEdit\">บันทึกบทพูด</button><button id=\"cancelDialogueEdit\">ยกเลิก</button></div>";b.closest(".item").appendChild(box);box.querySelector("textarea").value=d.text;b.disabled=true;box.querySelector("#cancelDialogueEdit").onclick=()=>{box.remove();b.disabled=false};box.querySelector("#saveDialogueEdit").onclick=()=>{let val=box.querySelector("textarea").value.trim();if(!val){alert("กรุณาใส่บทพูด");return}if(d.locked){alert("บทพูดถูกล็อก");return}d.text=val;save();render()}});
document.querySelectorAll("[data-delete-dialogue]").forEach(b=>b.onclick=()=>{let i=db.dialogues.findIndex(x=>x.id===b.dataset.deleteDialogue);if(i<0||db.dialogues[i].locked)return;if(confirm("ลบบทพูดนี้?")){db.dialogues.splice(i,1);save();render()}});
on("generate","click",generate);on("export","click",()=>{let blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),data:db},null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="isan-film-studio-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
on("import","change",async e=>{let f=e.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text()),d=obj.data;if(obj.version!==1||!d||!["projects","characters","scenes","dialogues"].every(k=>Array.isArray(d[k])))throw Error("รูปแบบไฟล์ไม่ถูกต้อง");if(!confirm("นำเข้าข้อมูลและเขียนทับทั้งหมด?"))return;db=d;project=db.projects[0]?.id||"";selectedScene=null;save();render()}catch(err){alert("นำเข้าไม่สำเร็จ: "+err.message)}})}
function generate(){const s=db.scenes.find(x=>x.id===selectedScene);if(!s)return;const lines=dlgList(s.id),issues=[];if(!String(s.location||"").trim())issues.push("ยังไม่ได้ระบุสถานที่และเวลาในฉาก");if(!String(s.camera||"").trim())issues.push("ยังไม่ได้ระบุมุมกล้องและระยะภาพ");if(!String(s.emotion||"").trim())issues.push("ยังไม่ได้ระบุอารมณ์เริ่มต้น");if(!String(s.action||"").trim())issues.push("ยังไม่ได้ระบุ START → ACTION → END");if(![4,6,8,10].includes(Number(s.duration)))issues.push("ความยาวฉากต้องเป็น 4, 6, 8 หรือ 10 วินาที");for(const d of lines){if(!Number.isFinite(d.start)||!Number.isFinite(d.end)||d.start<0||d.start>=s.duration||d.end>s.duration||d.end<=d.start)issues.push("ช่วงเวลาบทพูดไม่ถูกต้อง: "+d.speaker);if(!d.locked)issues.push("บทพูดยังไม่ล็อก: "+d.speaker)}for(let i=0;i<lines.length;i++)for(let j=i+1;j<lines.length;j++)if(lines[i].start<lines[j].end&&lines[j].start<lines[i].end&&lines[i].speaker!==lines[j].speaker)issues.push("ผู้พูดซ้อนเวลากัน: "+lines[i].speaker+" / "+lines[j].speaker);if(!lines.length)issues.push("ยังไม่มีบทพูด");const chars=byProject(db.characters);if(!chars.length)issues.push("ยังไม่มีตัวละครในโปรเจกต์ กรุณาเพิ่มตัวละครและข้อมูลมาสเตอร์");for(const c of chars){if(!String(c.identity||"").trim())issues.push("ตัวละคร "+c.name+" ยังไม่มีข้อมูลเอกลักษณ์/มาสเตอร์")}const identity=chars.map(c=>c.name+": "+c.identity).join("\n");const image="VERTICAL 9:16 CINEMATIC PHOTOREALISTIC LIVE ACTION\nSCENE: "+s.title+"\nLOCATION: "+s.location+"\nCAMERA: "+s.camera+"\nCHARACTER IDENTITY LOCK:\n"+identity+"\nEMOTION AT FRAME ZERO: "+s.emotion+"\nSTART FRAME: "+s.action+"\nNatural 50mm perspective. Preserve master character identity and geography. No overlays.";const video="FLOW VIDEO PROMPT — "+s.title+"\nDURATION: "+s.duration+" seconds\nFORMAT: Vertical 9:16 cinematic photorealistic\nLOCATION: "+s.location+"\nCAMERA: "+s.camera+"\nEMOTION CONTINUITY: "+s.emotion+"\nBLOCKING START → ACTION → END: "+s.action+"\nIDENTITY LOCK:\n"+identity+"\nEXACT APPROVED DIALOGUE (DO NOT CHANGE):\n"+lines.map(d=>d.start+"–"+d.end+"s | "+d.speaker+": "+d.text).join("\n")+"\nVOICE: Natural Isan, Khon Kaen accent. Match visible speaker lip sync. No invented or repeated dialogue.\nAUDIO: Natural ambience only; no laugh track or music.\nSTRICT: No prop morphing, no unapproved camera changes, preserve 180-degree axis and character continuity.";$("#output").innerHTML='<h3>ผลตรวจ QA</h3>'+(issues.length?'<p class="warn"><strong>ยังไม่พร้อมผลิตคลิป — กรุณาแก้ไข '+issues.length+' รายการ</strong></p>'+issues.map(x=>'<p class="warn">⚠ '+esc(x)+'</p>').join(""):'<p class="ok">✓ ผ่านการตรวจข้อมูลพื้นฐาน (ยังต้องตรวจภาพและผล FLOW จริง)</p>')+'<h3>IMAGE START FRAME PROMPT</h3><pre>'+esc(image)+'</pre><button id="copyImage">คัดลอก Image Prompt</button><h3>VIDEO PROMPT</h3><pre>'+esc(video)+'</pre><button id="copyVideo">คัดลอก Video Prompt</button>';$("#copyImage").disabled=issues.length>0;$("#copyVideo").disabled=issues.length>0;$("#copyImage").onclick=()=>navigator.clipboard.writeText(image).then(()=>alert("คัดลอกแล้ว")).catch(()=>alert("เบราว์เซอร์ไม่อนุญาตให้คัดลอก"));$("#copyVideo").onclick=()=>navigator.clipboard.writeText(video).then(()=>alert("คัดลอกแล้ว")).catch(()=>alert("เบราว์เซอร์ไม่อนุญาตให้คัดลอก"))}
render();
</script></body></html>
